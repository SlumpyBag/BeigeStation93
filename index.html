<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beige Station 93</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            gap: 20px;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            display: block;
            border: 2px solid #4a4a4a;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            text-shadow: 1px 1px 2px black;
        }
        #airBar {
            width: 150px;
            height: 20px;
            background: #333;
            border: 2px solid #666;
            margin-top: 5px;
        }
        #airFill {
            height: 100%;
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00);
            width: 100%;
            transition: width 0.1s;
        }
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #aaa;
            font-size: 12px;
        }
        #chatBox {
            width: 250px;
            height: 480px;
            background: #2a2a3e;
            border: 2px solid #4a4a4a;
            padding: 10px;
            overflow-y: auto;
            color: #ddd;
            font-size: 12px;
        }
        #chatBox div {
            margin-bottom: 5px;
            word-wrap: break-word;
        }
        #chatInput {
            width: 250px;
            background: #1a1a2e;
            border: 2px solid #4a4a4a;
            color: white;
            padding: 8px;
            font-family: monospace;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div>AIR: <span id="airText">100%</span></div>
            <div id="airBar"><div id="airFill"></div></div>
        </div>
        <div id="instructions">WASD/Arrows to move | Click doors to open | Enter near players to chat</div>
    </div>
    <div>
        <div id="chatBox"></div>
        <input type="text" id="chatInput" placeholder="Type message...">
    </div>
    <script src="game.js"></script>
</body>
</html>
